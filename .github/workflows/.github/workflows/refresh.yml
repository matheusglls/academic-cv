name: Refresh data daily 

on:
  schedule:
    - cron: '0 6 * * *'   # Every day at 06:00 UTC (03:00 Brazil time)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update publications and metrics
        run: node update-publications.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json data/metrics.json data/collaborations.json
          git diff --cached --quiet || git commit -m "Auto-update publications and metrics"
          git push

      - name: Touch to trigger Pages rebuild
        run: |
          date > refresh.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - uses: actions/deploy-pages@v4
